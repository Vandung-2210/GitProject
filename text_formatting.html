<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên kết yêu thích của tôi</title>
</head>
<body>

    <!-- Tiêu đề chính -->
    <h1>Liên kết yêu thích của tôi</h1>

    <!-- Danh sách không có thứ tự chứa các liên kết -->
    <ul>
        <!-- Liên kết dẫn đến trang ngoài và mở trong tab mới (target="_blank") -->
        <li>
            <a href="https://www.google.com" target="_blank" rel="noopener noreferrer">
                Google Tìm Kiếm (Mở trong tab mới)
            </a>
        </li>
        <li>
            <a href="https://github.com" target="_blank" rel="noopener noreferrer">
                GitHub (Nền tảng quản lý mã nguồn)
            </a>
        </li>
        <li>
            <a href="https://vi.wikipedia.org" target="_blank" rel="noopener noreferrer">
                Wikipedia (Bách khoa toàn thư mở)
            </a>
        </li>

        <!-- Liên kết đến một file HTML khác trong cùng thư mục -->
        <li>
            <a href="about.html">Trang Giới thiệu bản thân (about.html)</a>
        </li>

        <!-- Liên kết gửi email (mailto:) -->
        <li>
            <a href="mailto:example@gmail.com">Gửi email cho tôi (mailto:)</a>
        </li>
    </ul>

</body>
</html>
