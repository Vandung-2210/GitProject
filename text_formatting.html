            padding: 10px;

    <div class="overflow-box">
        Đây là một đoạn văn bản rất dài mà chúng ta sẽ kiểm tra cách `overflow` hoạt động khi nội dung vượt quá kích thước của phần tử. Lorem ipsum dolor sit amet, consectetur adipiscing elit. Phasellus ultricies nunc in mauris pharetra, a ultricies justo fermentum.
    </div>
